name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install "pip==25.3"
          python -m pip install -r requirements.txt "pip-tools==7.6.0" "pip-audit==2.10.1"
      - name: Verify Python lock file
        run: |
          pip-compile --quiet --strip-extras --output-file=requirements.txt requirements.in
          git diff --exit-code -- requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Pin npm
        run: npm install --global npm@11.17.0 --no-audit --no-fund
      - name: Install frontend dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - run: npm test
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm run audit:prod
