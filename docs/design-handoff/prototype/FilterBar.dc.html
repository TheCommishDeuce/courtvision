<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:sticky;top:0;z-index:30;background:var(--bg);border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0">
  <sc-if value="{{ phone }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:10px">
      <button onClick="{{ toggle }}" aria-expanded="{{ open }}" style="min-height:44px;padding:0 14px;border:1px solid var(--ink);border-radius:6px;background:transparent;cursor:pointer;font-weight:600;font-size:15px;flex:none">{{ btn }}</button>
      <div style="flex:1;min-width:0;font-size:14px;line-height:1.3"><span style="font-weight:600">{{ summary }}</span><br><span style="color:var(--ink2)">{{ detail }}</span></div>
    </div>
  </sc-if>
  <sc-if value="{{ showControls }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;margin-top:{{ gap }}">
      <sc-if value="{{ showTour }}" hint-placeholder-val="{{ false }}">
        <div role="group" aria-label="Tour" style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:12px;color:var(--ink2)">Tour</span>
          <div style="display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden">
            <sc-for list="{{ tours }}" as="o" hint-placeholder-count="2">
              <button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="min-height:40px;padding:0 14px;border:0;cursor:pointer;font-size:14px;font-weight:600;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <div role="group" aria-label="Surface" style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:12px;color:var(--ink2)">Surface</span>
        <div style="display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden">
          <sc-for list="{{ surfs }}" as="o" hint-placeholder-count="5">
            <button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 12px;border:0;border-right:1px solid var(--line2);cursor:pointer;font-size:14px;background:{{ o.bg }};color:{{ o.fg }}"><span aria-hidden="true" style="font-size:10px;color:{{ o.gc }}">{{ o.g }}</span>{{ o.label }}</button>
          </sc-for>
        </div>
      </div>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)">Level
        <select value="{{ v.level }}" onChange="{{ setLevel }}" style="min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:14px">
          <sc-for list="{{ levels }}" as="o" hint-placeholder-count="0"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
        </select>
      </label>
      <div style="display:flex;align-items:flex-end;gap:6px">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)">From
          <select value="{{ v.from }}" onChange="{{ setFrom }}" style="min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:14px">
            <sc-for list="{{ years }}" as="y" hint-placeholder-count="0"><option value="{{ y }}">{{ y }}</option></sc-for>
          </select>
        </label>
        <span style="padding-bottom:10px;color:var(--ink2)">–</span>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)">To
          <select value="{{ v.to }}" onChange="{{ setTo }}" style="min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:14px">
            <sc-for list="{{ years }}" as="y" hint-placeholder-count="0"><option value="{{ y }}">{{ y }}</option></sc-for>
          </select>
        </label>
      </div>
      <sc-if value="{{ isActive }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ reset }}" style="min-height:42px;padding:0 14px;border:0;background:transparent;color:var(--acc);cursor:pointer;font-size:14px;font-weight:600">Reset filters</button>
      </sc-if>
      <sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}">
        <div style="margin-left:auto;text-align:right;font-size:14px;line-height:1.35;padding-bottom:2px"><div style="font-weight:600">{{ summary }}</div><div style="color:var(--ink2)">{{ detail }}</div></div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onReset&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;showTour&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;yearMin&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1968,&quot;tsType&quot;:&quot;number&quot;},&quot;yearMax&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2026,&quot;tsType&quot;:&quot;number&quot;}}">
const SURF={Hard:['var(--hard)','■'],Clay:['var(--clay)','●'],Grass:['var(--grass)','▲'],Carpet:['var(--carpet)','◆']};
const LEVELS=[['All','All'],['Tour level','Tour level (all main-tour events)'],['Grand Slam','Grand Slam'],['Masters 1000','Masters 1000 / WTA 1000'],['500','500'],['250','250'],['Tour Finals','Tour Finals'],['Olympics','Olympics'],['Challenger','Challenger / WTA 125'],['ITF','ITF']];
class Component extends DCLogic {
  state={w:typeof window!=='undefined'?window.innerWidth:1280,open:false};
  componentDidMount(){this.onR=()=>this.setState({w:window.innerWidth});window.addEventListener('resize',this.onR)}
  componentWillUnmount(){window.removeEventListener('resize',this.onR)}
  renderVals(){
    const v=this.props.value||{surface:'All',level:'All',from:2026,to:2026},ch=this.props.onChange||(()=>{}),phone=this.state.w<760;
    const y0=this.props.yearMin||1968,y1=this.props.yearMax||2026,n=this.props.active||0;
    return {v,phone,desk:!phone,open:this.state.open,showControls:!phone||this.state.open,gap:phone?'12px':'0px',
      btn:n?`Filters (${n})`:'Filters',summary:this.props.summary||'',detail:this.props.detail||'',isActive:n>0,showTour:!!this.props.showTour,
      toggle:()=>this.setState(s=>({open:!s.open})),reset:()=>this.props.onReset&&this.props.onReset(),
      tours:[['M','ATP'],['F','WTA']].map(([k,l])=>{const on=v.tour===k;return{label:l,on,bg:on?'var(--ink)':'transparent',fg:on?'var(--bg)':'var(--ink)',pick:()=>ch({tour:k})}}),
      surfs:['All','Hard','Clay','Grass','Carpet'].map(s=>{const on=v.surface===s;return{label:s,on,g:s==='All'?'':SURF[s][1],bg:on?'var(--ink)':'transparent',fg:on?'var(--bg)':'var(--ink)',gc:on?'var(--bg)':(SURF[s]||[''])[0],pick:()=>ch({surface:s})}}),
      levels:LEVELS.map(([k,l])=>({v:k,label:l})),
      years:Array.from({length:y1-y0+1},(_,i)=>y1-i),
      setLevel:e=>ch({level:e.target.value}),setFrom:e=>ch({from:+e.target.value}),setTo:e=>ch({to:+e.target.value})};
  }
}
</script>
</body>
</html>
