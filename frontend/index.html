<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies a stored theme choice before first paint. Without this the
         page renders in the OS theme and then flips, which on a paper
         palette is a full-screen flash. -->
    <script>
      try {
        var t = localStorage.getItem('cv-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) { /* private mode — fall back to the OS preference */ }
    </script>
    <meta name="description" content="Every professional tennis match on record: head-to-heads, player careers, tournament recaps, and all-time leaderboards across the ATP and WTA tours, built on Jeff Sackmann's datasets." />
    <meta property="og:title" content="courtvision — professional tennis match archive" />
    <meta property="og:description" content="Every professional tennis match on record. Filter down to a single match, or query the tables yourself." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1119" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The three faces the design system names: Archivo (display and
         headline figures), Inter (body), JetBrains Mono (labels and column
         figures). Without this the whole type scale silently falls back. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Inter:wght@400..600&family=JetBrains+Mono:wght@400..700&display=swap"
    />
    <title>courtvision</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
