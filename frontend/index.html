<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies a stored theme choice before first paint, so a dark-theme
         reader doesn't see a light flash. useTheme owns it after that. -->
    <script>
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('cv-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) { /* private mode: follow the system */ }
    </script>
    <meta name="description" content="Find the story in a century of tennis results: players, head-to-heads, tournaments, records and a SQL Lab over every ATP and WTA match on record." />
    <meta property="og:title" content="courtvision — find the story in the numbers" />
    <meta property="og:description" content="Every ATP and WTA match on record: player careers, head-to-heads, tournament recaps, records, and the Lab for your own questions." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13100d" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Schibsted Grotesk for everything, IBM Plex Mono for scores, SQL and
         codes (docs/design-handoff/DESIGN.md › Typography). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..800&display=swap"
    />
    <title>courtvision</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
